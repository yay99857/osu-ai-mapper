[project]
name = "osu-ai-audio"
version = "0.1.0"
description = "Audio analysis for osu-ai-mapper: decoding, constant-tempo timing, onsets and grid features."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "librosa>=0.11",
    "soundfile>=0.13",
    "av>=19.0.0",
]

[project.scripts]
osu-ai-analyze = "osu_ai_audio.cli:main"
osu-ai-bench-timing = "osu_ai_audio.bench_timing:main"
osu-ai-analyze-dataset = "osu_ai_audio.dataset_analysis:main"
osu-ai-to-wav = "osu_ai_audio.wav:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

