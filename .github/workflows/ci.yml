name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore OsuAiMapper.slnx --locked-mode
      - run: dotnet build OsuAiMapper.slnx --no-restore -c Release
      - run: dotnet test OsuAiMapper.slnx --no-build -c Release
      - name: Round-trip report
        run: dotnet run --project tools/compatibility-harness --no-build -c Release -- roundtrip tests/fixtures/osu

  audio-analysis:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --project engines/audio-analysis
      - run: uv run --project engines/audio-analysis pytest engines/audio-analysis

  rhythm-model:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev --project ml/rhythm
      - run: uv run --project ml/rhythm pytest ml/rhythm
